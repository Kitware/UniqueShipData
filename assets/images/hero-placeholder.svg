<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Hero image placeholder</title>
  <desc id="description">An abstract aerial ocean scene with simplified vessel shapes.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#194c66"/>
      <stop offset="0.55" stop-color="#0b607d"/>
      <stop offset="1" stop-color="#07344f"/>
    </linearGradient>
    <pattern id="water" width="120" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q30 4 60 20 T120 20" fill="none" stroke="#8fc9d7" stroke-opacity=".12" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#ocean)"/>
  <rect width="1920" height="1080" fill="url(#water)"/>
  <g fill="#d5e4df" opacity=".55">
    <path d="M1230 260l310 72-22 54-322-61z"/>
    <path d="M1410 650l230 48-18 42-238-38z"/>
    <path d="M820 500l190 42-15 36-198-34z"/>
  </g>
  <g fill="none" stroke="#62d94d" stroke-width="3" opacity=".55">
    <rect x="1180" y="205" width="400" height="235"/>
    <rect x="1360" y="610" width="330" height="180"/>
    <rect x="760" y="455" width="300" height="160"/>
  </g>
  <text x="960" y="980" fill="#fff" fill-opacity=".45" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" letter-spacing="8">REPLACE WITH HERO IMAGE</text>
</svg>
